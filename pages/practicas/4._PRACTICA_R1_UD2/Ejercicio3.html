<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
    <style>
        body {
            font-family: Verdana, sans-serif;
        }
        table {
            border-collapse: collapse;
            background-color: rgb(176, 252, 252);
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
    </style>
</head>
<body>
<table>
  <caption>Tabla de Contenido</caption>

  <colgroup>
    <col span="1" />
    <col span="1" />
    <col span="1" />
  </colgroup>

  <thead>
    <tr>
      <th colspan="3">Contenido del Libro</th>
    </tr>
    <tr>
      <th>Capítulo</th>
      <th>Título del Capítulo</th>
      <th>Páginas</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td>1</td>
      <td>Capitulo 1</td>
      <td>1-5</td>
    </tr>

    <tr>
      <td>2</td>
      <td>Capitulo 2</td>
      <td>6-10</td>
    </tr>

    <tr>
      <td>3</td>
      <td>Capitulo 3</td>
      <td>11-15</td>
    </tr>

    <tr>
      <td>4</td>
      <td>Capitulo 4</td>
      <td>16-20</td>
    </tr>

    <tr>
      <td>5</td>
      <td>Capitulo 5</td>
      <td>21-25</td>
    </tr>

    <tr>
      <td>6</td>
      <td>Capitulo 6</td>
      <td>26-30</td>
    </tr>
  </tbody>

  <tfoot>
    <tr>
      <td colspan="3">Fin de la Tabla de Contenido</td>
    </tr>
  </tfoot>
</table>
</body>
</html>
