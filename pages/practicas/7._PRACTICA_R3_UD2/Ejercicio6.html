<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breadcrumb Raro</title>
    <style>
.breadcrum {
    font-family: Arial;
    padding: 0.5em;
}

.breadcrum a {
    color: #0095eb;
    text-decoration: none;
    font-weight: bold;
}

.breadcrum a:hover {
    color: #006196;
    text-decoration: underline;
}

.left {
    float: left;
}

.right {
    float: right;
}
    </style>
</head>
<body>
    <div class="breadcrum">
        <a href="#" class="left"><< Anterior</a>
        <a href="#" class="right">Siguiente >> </a>
    </div>
</body>
</html>
