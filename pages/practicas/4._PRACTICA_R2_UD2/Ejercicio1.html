<!-- Se usa la abreviación "!"-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>LAS EXPLICACIONES ESTAN EN EL CODIGO HTML COMO COMENTARIOS</h1>
    <!-- Se usa la abreviación ".container"-->
    <div class="container"></div>

    <!-- Se usa "div.clase1.clase2"-->
    <div class="clase1 clase2"></div>

    <!-- Se usa "div#header.contenedor" -->
    <div id="header" class="contenedor"></div>

    <!-- Se usa ul>li*5-->
    <ul>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <!-- Se usa "ul>li.item$*5" -->
    <ul>
        <li class="item1"></li>
        <li class="item2"></li>
        <li class="item3"></li>
        <li class="item4"></li>
        <li class="item5"></li>
    </ul>

    <!-- Se usa a[href="https://google.com"]{Google} -->
    <a href="https://google.com">Google</a>



    <!-- Se usa form>input[type="text"]+input[type="email"]+input[type="submit"] -->
    <form>
        <input type="text">
        <input type="email">
        <input type="submit">
    </form>

    <!-- Se usa table>tr*3>td*3 -->
    <table>
        <tr>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td></td>
            <td></td>
            <td></td>
        </tr>
    </table>

    <!-- Se usa section>h2+p -->
    <section>
        <h2></h2>
        <p></p>
    </section>

    <!-- Se usa img[src="image$"].image*3 -->
    <img src="image1" class="image">
    <img src="image2" class="image">
    <img src="image3" class="image">

    <!-- Se usa p{Este es un párrafo} -->
    <p>Este es un párrafo</p>

    <!-- Se usa button{Enviar} -->
    <button>Enviar</button>

    <!-- Se usa img[src="image.jpg" alt="Descripción de la imagen"] -->
    <img src="image.jpg" alt="Descripción de la imagen">

    <!-- Se usa header>h1{Bienvenido}+a[href="#"]{Inicio} -->
    <header>
        <h1>Bienvenido</h1>
        <a href="#">Inicio</a>
    </header>

    <!-- Se usa input[type="text" placeholder="Escribe aquí"] -->
    <input type="text" placeholder="Escribe aquí">

</body>
</html>
