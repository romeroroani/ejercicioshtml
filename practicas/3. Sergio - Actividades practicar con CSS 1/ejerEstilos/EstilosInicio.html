<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>VersoPerversos</title>
    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .navbar {
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            color: white;
        }

        .navbar img {
            width: 55px;
            height: 55px;
            border-radius: 4px;
            object-fit: cover;
        }

        .navbar .menu {
            display: flex;
            gap: 25px;
            font-size: 16px;
        }

        .navbar .menu a {
            color: white;
            text-decoration: none;
            transition: 0.2s;
        }

        .navbar .menu a:hover {
            opacity: 0.6;
        }

        .navbar .nombre {
            font-size: 22px;
            font-weight: bold;
        }

        .contenedor {
            width: 60%;
            margin: 40px auto;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.15);
        }

        .card h2 {
            margin-top: 0;
            font-size: 22px;
            color: #333;
        }

        .card p {
            color: #555;
            font-size: 15px;
        }

        footer {
            background-color: #333;
            color: #ddd;
            text-align: center;
            padding: 18px 0;
            margin-top: 60px;
            font-size: 14px;
        }

    </style>
</head>
<body>

    <div class="navbar"
        <img src="imagen.jpg" alt="logo">
        
        <div class="menu">
            <a href="EstilosInicio.html">Inicio</a>
            <a href="servicios.html">Servicios</a>
            <a href="contacto.html">Contacto</a>
        </div>

        <div class="nombre">SergioCops</div>
    </div>

    <div class="contenedor">

        <div class="card">
            <h2>Bienvenido a VersoPerversos</h2>
            <p>Descubre la creatividad en cada diseño.</p>
        </div>

    </div>

    <footer>
        © 2024 Diablos. Todos los derechos reservados a Satan
    </footer>

</body>
</html>
